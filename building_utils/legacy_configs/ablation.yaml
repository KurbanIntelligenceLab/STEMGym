# Ablation Study (quick version with corrected world names)
# Compare STEMAgent variants to measure each component's contribution

name: ablation_study

agents:
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner

tasks:
  - defect_census
  - phase_mapping

worlds:
  - test_world
  - srtio3_clustered_medium_verified
  - batio3_interface_medium_verified

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/ablation.json
