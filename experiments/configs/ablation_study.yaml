# Ablation Study — Component Contribution Analysis
# 5 STEMAgent variants × 3 medium-difficulty worlds × 3 tasks × 5 seeds = 225 episodes
# Note: phase_mapping only meaningful on BaTiO3, targeted only on SiGe

name: ablation_study

agents:
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - srtio3_clustered_medium_verified
  - batio3_interface_medium_verified
  - sige_gradient_clustered_medium_verified

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/ablation_study.json
