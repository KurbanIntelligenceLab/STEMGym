# Ablation Study: Isolating the contribution of each STEMAgent component
# stem_agent vs ablated variants on a representative subset

name: ablation_study

agents:
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/ablation_new.json
