# Replay vs Simulation Comparison
# Run agents on both replay and simulated data to verify ranking correlation

name: replay_comparison

agents:
  - random
  - raster
  - gp_ucb
  - stem_agent

tasks:
  - defect_census

worlds:
  - test_world
  - replay_world

seeds: 3
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/replay_comparison.json
