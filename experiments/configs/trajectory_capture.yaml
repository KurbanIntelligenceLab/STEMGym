# Trajectory Capture: record per-step trajectories for spatial analysis
# 4 agents × defect_census × 2 worlds × 3 seeds = 24 episodes
# save_trajectories: true records position/action/dose per step
name: trajectory_capture

agents:
  - random_equipped
  - raster_equipped
  - gp_ucb_equipped
  - stem_agent

tasks:
  - defect_census

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy

seeds: 3
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5
save_trajectories: true
output: results/trajectory_capture.json
