# Defect Census — 5 seeds (complete run, fresh output)
# 10 agents × 7 worlds × 5 seeds = 350 episodes
# Same matrix as main_defect_census.yaml but fresh output file to avoid
# resume skipping 2-seed combos from the original run.

name: defect_census_5seeds

agents:
  - random
  - raster
  - gp_ucb
  - gp_ucb_equipped
  - raster_equipped
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner

tasks:
  - defect_census

worlds:
  - srtio3_clustered_easy
  - srtio3_clustered_medium
  - batio3_interface_easy
  - batio3_interface_medium
  - batio3_interface_hard
  - sige_gradient_clustered_easy
  - sige_gradient_clustered_medium

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/defect_census_5seeds.json
