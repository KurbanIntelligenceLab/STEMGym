# Ablation Study
# Compare STEMAgent variants to measure each component's contribution
# stem_agent (full) vs no_planner vs no_uncertainty vs rule_planner

name: ablation_study

agents:
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner

tasks:
  - defect_census
  - phase_mapping

worlds:
  - test_world
  - srtio3_medium
  - batio3_medium

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/ablation.json
