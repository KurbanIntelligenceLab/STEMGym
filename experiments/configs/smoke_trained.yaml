# Smoke test: Verify trained models load and work across all 3 tasks
# 4 agents × 3 tasks × 2 worlds × 2 seeds = 48 episodes

name: smoke_trained

agents:
  - random
  - raster
  - raster_equipped
  - stem_agent

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - batio3_interface_easy
  - sige_gradient_clustered_easy

seeds: 2
budget: 3000.0
max_steps: 100
score_every_n_acquires: 5

output: results/smoke_trained.json
