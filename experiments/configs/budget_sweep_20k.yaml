# High-budget sweep at B=20,000 e/Å^2 (~12% coverage). Tests whether
# perception-dominance holds outside the ~3% coverage regime in main results.
# 3 equipped agents x 3 worlds x 10 seeds = 90 episodes.
#
# max_steps=600: at d0=100 e/Å^2 and z=1, B=50k ≈ 500 acquisitions worst-case;
# default max_steps=200 would terminate prematurely.

name: budget_sweep_20k

agents:
  - raster_equipped
  - gp_ucb_equipped
  - stem_agent

tasks:
  - defect_census

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy

seeds: 10
budget: 20000.0
max_steps: 600
score_every_n_acquires: 5

output: results/budget_sweep_20k.json
