# Difficulty scaling: How does performance degrade with difficulty?
# 4 agents × 2 tasks × 3 BaTiO3 difficulties × 5 seeds = 120 episodes

name: trained_difficulty_scaling

agents:
  - raster
  - raster_equipped
  - gp_ucb_equipped
  - stem_agent

tasks:
  - defect_census
  - phase_mapping

worlds:
  - batio3_interface_easy
  - batio3_interface_medium
  - batio3_interface_hard

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/trained_difficulty_scaling.json
