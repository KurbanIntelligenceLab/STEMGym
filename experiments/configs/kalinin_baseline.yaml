# Kalinin/Ziatdinov 2022/2023 GP-BO baseline — published prior-art comparison.
# 2 agents x 3 tasks x 5 worlds x 10 seeds = 300 episodes.

name: kalinin_baseline

agents:
  - kalinin_gp_bo
  - kalinin_gp_bo_equipped

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy
  - gan_easy
  - pt_nanoparticles_easy

seeds: 10
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/kalinin_baseline.json
