# Acquisition Function Comparison: UCB vs EI vs TS
# 6 agents × defect_census × 5 easy worlds × 5 seeds = 150 episodes
# GPU needed (BoTorch GP fitting)
name: acq_func_comparison

agents:
  - gp_ucb_equipped
  - gp_ucb_ei_equipped
  - gp_ucb_ts_equipped
  - stem_agent
  - stem_agent_ei
  - stem_agent_ts

tasks:
  - defect_census

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy
  - gan_easy
  - pt_nanoparticles_easy

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5
output: results/acq_func_comparison.json
workers: 4
