# Real-data sanity check across a Sm-doping gradient on Sm-doped BiFeO3 HAADF-STEM
# Source: Ghosh, Nelson, Ziatdinov, Kalinin (Zenodo 4555979, CC-BY 4.0, 2021)
# Surfaced via Pratiush 2025 Mic-hackathon team14 notebook (Zenodo 15579940)
# 2 agents x 1 task x 5 worlds x 3 seeds = 30 episodes

name: real_data_sanity

agents:
  - raster
  - raster_equipped

tasks:
  - phase_mapping  # real ferroelectric polarization domains as ground truth

worlds:
  - sm_bfo_sm0   # 0%  Sm (undoped)   — file Sm_0_1
  - sm_bfo_sm7   # 7%  Sm              — file Sm_7_2
  - sm_bfo_sm10  # 10% Sm              — file Sm_10_1
  - sm_bfo_sm13  # 13% Sm              — file Sm_13_0
  - sm_bfo_sm20  # 20% Sm              — file Sm_20_0

seeds: 3
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/real_data_sanity.json
