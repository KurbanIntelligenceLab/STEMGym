# Main Results: All non-VLM agents × 3 tasks × all available worlds
# Produces the primary results table for the paper

name: main_results

agents:
  - random
  - raster
  - gp_ucb
  - gp_ucb_equipped
  - raster_equipped
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - srtio3_clustered_easy
  - srtio3_clustered_medium
  - batio3_interface_easy
  - batio3_interface_medium
  - batio3_interface_hard
  - sige_gradient_clustered_easy
  - sige_gradient_clustered_medium
  - sige_gradient_clustered_hard
  - gan_easy

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/main_results.json
