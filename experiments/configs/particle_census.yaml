# Particle Census: Pt nanoparticle detection, sizing, and morphology
# 15 agents × 1 task × 3 Pt worlds × 10 seeds = 450 episodes

name: particle_census

agents:
  - random
  - raster
  - gp_ucb
  - gp_ucb_equipped
  - raster_equipped
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - dqn
  - dqn_equipped
  - ppo
  - ppo_equipped
  - sac
  - sac_equipped

tasks:
  - particle_census

worlds:
  - pt_nanoparticles_easy
  - pt_nanoparticles_medium
  - pt_nanoparticles_hard

seeds: 10
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/particle_census.json
