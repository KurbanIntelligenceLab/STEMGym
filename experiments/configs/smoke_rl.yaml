# Smoke test for RL agents (DQN, PPO, SAC + equipped variants)
# 6 RL agents × 1 world × 2 seeds = 12 episodes
# Quick validation that all agents load and produce valid DEC-AUC

name: smoke_rl

agents:
  - dqn
  - dqn_equipped
  - ppo
  - ppo_equipped
  - sac
  - sac_equipped

tasks:
  - defect_census

worlds:
  - test_world

seeds: 2
budget: 3000.0
max_steps: 100
score_every_n_acquires: 3

output: results/smoke_rl.json
