# Main Benchmark — Targeted Characterization Task
# 16 agents × 2 SiGe worlds × 10 seeds = 320 episodes
# Targeted task only scores non-trivially on SiGe (which has substitution defects)

name: main_targeted

agents:
  - random
  - raster
  - gp_ucb
  - gp_ucb_equipped
  - raster_equipped
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner
  - dqn
  - dqn_equipped
  - ppo
  - ppo_equipped
  - sac
  - sac_equipped

tasks:
  - targeted

worlds:
  - sige_gradient_clustered_easy
  - sige_gradient_clustered_medium

seeds: 10
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/main_targeted.json
