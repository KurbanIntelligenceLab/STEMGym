# Frontier-flagship VLM sanity check
# 1 frontier model x 1 task x 5 worlds x 3 seeds = 15 episodes
# Tests whether the production-tier VLM perception gap reflects a model-tier
# limitation rather than VLM perception in general.

name: frontier_vlm_sanity

agents:
  - raster_vlm_opus  # Claude Opus 4.7 via OpenRouter

tasks:
  - defect_census  # the headline task where production-tier VLMs fail hardest

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy
  - gan_easy
  - pt_nanoparticles_easy

seeds: 3
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/frontier_vlm_sanity.json
