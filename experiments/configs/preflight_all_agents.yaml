# Preflight: all 16 agents on test_world, 2 seeds
# Verifies every agent works before committing to full Vast.ai runs
# 16 agents × 1 world × 2 seeds = 32 episodes

name: preflight_all_agents

agents:
  - random
  - raster
  - gp_ucb
  - gp_ucb_equipped
  - raster_equipped
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner
  - dqn
  - dqn_equipped
  - ppo
  - ppo_equipped
  - sac
  - sac_equipped

tasks:
  - defect_census

worlds:
  - test_world

seeds: 2
budget: 3000.0
max_steps: 100
score_every_n_acquires: 3

output: results/preflight_all_agents.json
