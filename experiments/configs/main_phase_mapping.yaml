# Main Benchmark — Phase Mapping Task
# 10 agents × 3 BaTiO3 worlds × 5 seeds = 150 episodes
# Phase mapping only scores non-trivially on BaTiO3 (which has phase_map GT)

name: main_phase_mapping

agents:
  - random
  - raster
  - gp_ucb
  - gp_ucb_equipped
  - raster_equipped
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner

tasks:
  - phase_mapping

worlds:
  - batio3_interface_easy_verified
  - batio3_interface_medium_verified
  - batio3_interface_hard_verified

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/main_phase_mapping.json
