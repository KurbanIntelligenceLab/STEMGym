# Ablation study: Isolating contribution of each STEMAgent component
# 5 agents × 3 tasks × 3 medium worlds × 5 seeds = 225 episodes

name: trained_ablation_study

agents:
  - stem_agent
  - no_planner
  - no_uncertainty
  - rule_planner
  - llm_planner

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - srtio3_clustered_medium
  - batio3_interface_medium
  - sige_gradient_clustered_medium

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/trained_ablation_study.json
