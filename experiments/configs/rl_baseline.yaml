# RL Baseline — DQN agent evaluation (addresses reviewer Q5)
# 2 agents × defect_census × 5 easy worlds × 5 seeds = 50 episodes
# Demonstrates RL struggles with sparse rewards in dose-limited STEM

name: rl_baseline

agents:
  - dqn
  - dqn_equipped

tasks:
  - defect_census

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy
  - gan_easy
  - pt_nanoparticles_easy

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/rl_baseline.json
