# LLM Planner Comparison
# Compare rule-based vs LLM planner (requires OPENROUTER_API_KEY)
# Without API key, llm_planner falls back to rule-based
# 4 agents × 2 tasks × 15 worlds × 5 seeds = 600 episodes

name: llm_planner_comparison

agents:
  - stem_agent
  - llm_planner
  - rule_planner
  - no_planner

tasks:
  - defect_census
  - phase_mapping

worlds:
  - srtio3_clustered_easy
  - srtio3_clustered_medium
  - srtio3_clustered_hard
  - batio3_interface_easy
  - batio3_interface_medium
  - batio3_interface_hard
  - sige_gradient_clustered_easy
  - sige_gradient_clustered_medium
  - sige_gradient_clustered_hard
  - gan_easy
  - gan_medium
  - gan_hard
  - pt_nanoparticles_easy
  - pt_nanoparticles_medium
  - pt_nanoparticles_hard

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/llm_planner.json
