# VLM Comparison: VLM-equipped agents vs trained CNN vs heuristic
# Tests all 6 VLM agents + equipped + naive baselines on a subset of worlds
# Requires OPENROUTER_API_KEY

name: vlm_comparison

agents:
  - raster
  - raster_equipped
  - raster_vlm_claude
  - raster_vlm_gpt5
  - raster_vlm_llama
  - gp_ucb
  - gp_ucb_equipped
  - gp_ucb_vlm_claude
  - gp_ucb_vlm_gpt5
  - gp_ucb_vlm_llama

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/vlm_comparison.json
