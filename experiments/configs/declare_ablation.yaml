# DECLARE Ablation: with vs without DECLARE annotations
# 2 agents × (defect_census + targeted) × 3 easy worlds × 5 seeds = 60 episodes
# GPU needed (STEMAgent uses BoTorch + neural analyst)
name: declare_ablation

agents:
  - stem_agent_declare
  - stem_agent_no_declare

tasks:
  - defect_census
  - targeted

worlds:
  - srtio3_clustered_easy
  - batio3_interface_easy
  - sige_gradient_clustered_easy

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5
output: results/declare_ablation.json
workers: 2
