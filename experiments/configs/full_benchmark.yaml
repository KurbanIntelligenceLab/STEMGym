# Full STEMGym Benchmark
# All agents × all tasks × all simulated worlds × 5 seeds
# Expected runtime: ~30-60 minutes depending on hardware

name: full_benchmark

agents:
  - random
  - raster
  - gp_ucb
  - stem_agent

tasks:
  - defect_census
  - phase_mapping
  - targeted

worlds:
  - test_world
  - srtio3_medium
  - batio3_medium
  - sige_medium

seeds: 5
budget: 5000.0
max_steps: 200
score_every_n_acquires: 5

output: results/full_benchmark.json
