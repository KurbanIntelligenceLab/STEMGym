[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stem-gym"
version = "0.1.0"
description = "Gym-compatible benchmark for autonomous STEM microscopy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Can Polat", email = "can.polat0@yahoo.com"},
]

dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "h5py>=3.8",
    "scipy>=1.10",
    "torch>=2.0",
    "botorch>=0.9",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "scikit-image>=0.21",
]

[project.urls]
Repository = "https://github.com/KurbanIntelligenceLab/STEMGym"
Dataset = "https://huggingface.co/datasets/johnpolat/STEMGym"

[project.optional-dependencies]
sim = [
    "abtem>=1.0.0b30",
    "pymatgen>=2023.5",
    "mp-api>=0.33",
    "ase>=3.22",
    "cupy-cuda12x>=13.0",
]
replay = [
    "py4dstem>=0.14",
]
human = [
    "gradio>=4.0",
]
rl = [
    "stable-baselines3>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
stemgym = "experiments.run_benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that run abTEM simulations (deselect with '-m \"not slow\"')",
]

[tool.hatch.build.targets.wheel]
packages = ["stem_gym"]
